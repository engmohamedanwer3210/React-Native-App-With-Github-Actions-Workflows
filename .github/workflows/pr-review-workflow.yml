name: pr-review-workflow
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore: #the workflow will not run if only these files are changed
      - README.md
      - docs/**

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: validate pr title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN='^(feat|fix|chore|docs|refactor|test|perf|ci|build|revert): .+'

          echo "Checking PR title: $PR_TITLE"

          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title must follow semantic format"
            exit 1
          fi

          echo "✅ PR title is valid"

  lint:
    runs-on: ubuntu-latest
    needs: [validate-pr-title]
    steps:
      - name: Get code
        uses: actions/checkout@v6

      - name: Install nodeJS
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    needs: [validate-pr-title]
    steps:
      - name: Get code
        uses: actions/checkout@v6

      - name: Install nodeJS
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run type-check

  unit-test-with-coverage:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Get code
        uses: actions/checkout@v6

      - name: Install nodeJS
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm  run test -- --coverage

